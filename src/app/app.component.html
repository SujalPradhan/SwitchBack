@if (updateAvailable()) {
  <div class="update-banner" role="status">
    <span class="update-text">A new version of Switch-Back is ready.</span>
    <div class="update-actions">
      <button class="btn-update" (click)="applyUpdate()">Update now</button>
      <button class="btn-dismiss" (click)="dismissUpdate()" aria-label="Dismiss">
        <sb-icon name="plus" [size]="16" style="transform: rotate(45deg)" />
      </button>
    </div>
  </div>
}

<router-outlet />
