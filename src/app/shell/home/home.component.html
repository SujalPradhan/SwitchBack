<div class="home">
  <header class="home-header">
    <h1>Switchback</h1>
    <p class="tagline">Local multiplayer. No internet. No fuss.</p>
  </header>

  <main class="cards">
    <a id="host-link" [routerLink]="['/host']" class="card card-host">
      <span class="card-icon">⚡</span>
      <div>
        <strong>Start a Room</strong>
        <p>Host a game and invite nearby players.</p>
      </div>
    </a>

    <a id="guest-link" [routerLink]="['/join']" class="card card-guest">
      <span class="card-icon">📱</span>
      <div>
        <strong>Join a Room</strong>
        <p>Scan the host's QR code to jump in.</p>
      </div>
    </a>
  </main>
</div>
