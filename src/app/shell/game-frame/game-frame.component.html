<div class="frame-shell">
  @if (!gameUrl()) {
    <div class="no-game">
      <p>No game URL provided.</p>
      <button class="btn-back" (click)="goBack()">
        <sb-icon name="arrow-left" [size]="18" />
        Back to lobby
      </button>
    </div>
  } @else {
    <div class="frame-header">
      <button class="btn-back" (click)="goBack()">
        <sb-icon name="arrow-left" [size]="18" />
        Lobby
      </button>
      <span class="game-title">{{ gameName() }}</span>
      <div class="player-count">
        <sb-icon name="users" [size]="16" />
        {{ room.players().length }}
      </div>
    </div>
    <iframe
      #gameFrame
      class="game-iframe"
      [src]="safeSrc()"
      sandbox="allow-scripts allow-same-origin"
      allow="fullscreen"
      title="Game"
    ></iframe>
  }
</div>
